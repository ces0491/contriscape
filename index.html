<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>contriscape: fly through your GitHub contributions</title>
    <meta
      name="description"
      content="Enter a GitHub username and fly a starfighter through a 3D city built from that person's contribution history, one tower per day."
    />
    <meta name="theme-color" content="#060a13" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="contriscape: fly through your GitHub contributions" />
    <meta
      property="og:description"
      content="A 3D city built from any GitHub user's contribution history, one tower per day."
    />
    <meta property="og:url" content="https://contriscape.sheetsolved.com/" />
    <meta property="og:image" content="https://contriscape.sheetsolved.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://contriscape.sheetsolved.com/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&family=JetBrains+Mono:wght@400;600&display=swap"
    />
  </head>
  <body class="empty">
    <div id="stage">
      <canvas id="gl" aria-label="Three-dimensional city of contribution data. Each tower is one day."></canvas>
    </div>

    <svg id="canopy" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true" hidden>
      <path
        class="frame"
        fill-rule="evenodd"
        d="M0 0H1600V900H0Z M250 58 L1350 58 L1520 560 L1200 900 L400 900 L80 560 Z"
      />
      <path class="strut" d="M800 58 L640 900 M800 58 L960 900" />
      <path class="edge" d="M250 58 L1350 58 L1520 560 L1200 900 M400 900 L80 560 L250 58" />
    </svg>
    <svg id="reticle" width="64" height="64" viewBox="-32 -32 64 64" aria-hidden="true" hidden>
      <circle r="15" />
      <path d="M-28 0H-19M19 0H28M0 -28V-19M0 19V28" />
      <circle class="dot" r="1.6" />
    </svg>
    <div id="bracket" hidden></div>
    <div id="lock" hidden><b></b><span></span></div>

    <header class="hud top">
      <div class="brand">
        <h1 id="login"></h1>
        <p id="scopeLabel"></p>
      </div>
      <form id="lookup" class="lookup" role="search" autocomplete="off">
        <label class="visually-hidden" for="loginInput">GitHub username</label>
        <input
          id="loginInput"
          name="login"
          placeholder="GitHub username"
          maxlength="40"
          spellcheck="false"
          autocapitalize="none"
          autocorrect="off"
        />
        <button type="submit">Fly</button>
      </form>
      <div class="actions">
        <button id="share" type="button">Copy link</button>
        <div class="modes" role="group" aria-label="Camera">
          <button id="m-fly" type="button" aria-pressed="true">Autopilot</button>
          <button id="m-pilot" type="button" aria-pressed="false">Pilot</button>
          <button id="m-orbit" type="button" aria-pressed="false">Orbit</button>
        </div>
      </div>
    </header>
    <p id="hint" hidden></p>
    <div id="status" role="status" hidden></div>

    <footer class="hud deck">
      <div class="readout">
        <div class="now">
          <span id="date"></span>
          <span id="dayCount"></span>
        </div>
        <dl class="stats">
          <div>
            <dt>Running total</dt>
            <dd id="running"></dd>
          </div>
          <div>
            <dt>Busiest day</dt>
            <dd id="busiest"></dd>
          </div>
          <div>
            <dt>Longest streak</dt>
            <dd id="streak"></dd>
          </div>
          <div>
            <dt>Active days</dt>
            <dd id="active"></dd>
          </div>
        </dl>
      </div>
      <div class="years" id="years" role="group" aria-label="Choose a year"></div>
      <div class="track">
        <button id="play" type="button">Pause</button>
        <div class="timeline" id="timeline">
          <canvas id="spark" aria-hidden="true"></canvas>
          <div id="head"></div>
          <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Date" />
        </div>
      </div>
      <p class="note" id="note"></p>
    </footer>
    <button id="fire" type="button" hidden>Fire</button>
    <div id="tip" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
